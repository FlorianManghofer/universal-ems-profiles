name: Publish signed device profiles

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Catalog version (e.g. 1.0.0), must match catalog.json'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed profiles
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install signing dependencies
        run: python -m pip install 'cryptography>=43,<47'
      - name: Build and sign read-only profile bundle
        env:
          PROFILE_SIGNING_KEY_B64: ${{ secrets.PROFILE_SIGNING_KEY_B64 }}
          CATALOG_VERSION: ${{ inputs.version }}
        run: |
          python scripts/release.py build --version "$CATALOG_VERSION"
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_VERSION: ${{ inputs.version }}
        run: |
          gh release create "profiles-v${CATALOG_VERSION}" \
            dist/bundle.json dist/bundle.sig \
            --title "Universal EMS profiles v${CATALOG_VERSION}" \
            --notes "Signed, reviewed, read-only device profiles."
